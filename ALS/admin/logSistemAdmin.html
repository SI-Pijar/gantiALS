<!doctype html>

    <link rel="stylesheet" href="admin.css" />

    />
  </head>
  <body>
    <div class="TataLetakAdmin">
      <aside class="SidebarNavigasi">
        <div class="LogoSidebar">
          <img src="gambar/logo als.jpg" alt="Logo ALS" />
          <span>ALS ADMIN</span>
        </div>
        <nav class="MenuNavigasi">
          <a href="dashboardAdmin.html" class="ItemMenu">
            <i class="fa-solid fa-gauge-high"></i>
            <span>Dashboard</span>
          </a>

          <a href="kelolaJadwalAdmin.html" class="ItemMenu">
            <i class="fa-solid fa-calendar-days"></i>
            <span>Kelola Jadwal</span>
          </a>

          <a href="kelolaPenumpangAdmin.html" class="ItemMenu">
            <i class="fa-solid fa-users"></i>

          <div class="ProfilAdmin">
            <span>Selamat datang, <strong>Admin Utama</strong></span>
            <i class="fa-solid fa-user-shield"></i>
